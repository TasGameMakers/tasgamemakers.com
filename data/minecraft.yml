- year: 2026
  title: "Minecraft Showcase 2026"
  summary: "The selected entries below were showcased at [Level Up Tasmania 2026](/level-up-tasmania/2026/), a public exhibition of Tasmanian-made video games held in nipaluna/Hobart. The Minecraft booth was visited by thousands of guests, who saw these entries around the booth. Some entries were put on computers for people to play at the booth, and these were played constantly for the two days of the event. The event also includes a live showcase of competition entries and announcement of winners on stage."
